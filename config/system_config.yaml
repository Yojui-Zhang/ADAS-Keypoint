  conf_threshold: 0.5
  min_x_m: 0.05
  max_x_m: 30.0
  max_abs_y_m: 5.0
  curvature_samples: 6
  metric_w_mean: 1.0
  metric_w_std: 0.5
  use_sigmoid_probability: 1
  metric_threshold: 0.08
  metric_sensitivity: 25.0
