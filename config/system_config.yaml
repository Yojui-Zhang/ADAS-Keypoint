%YAML:1.0
---
app:
  run_mode: "real_car"      # real_car video virtual_road
  camera_yaml_path: "../Camera-Config/Sensing-3M.yaml"
  icon_path: "../icon"
  fallback_ego_speed_kmh: 30.0
  enable_collision_actuation: 0
  draw_collision_border: 1
  draw_collision_target_box: 1
  show_timing_ms: 1
  render_backend: "opencv"   # opencv 或 opengl；opengl 需以 _opengl 編譯，否則自動 fallback
  wait_key_ms: 30

  enable_keypad_evdev: 1
  keypad_device_path: "/dev/input/event1"

  can_tx_master_enable: 0
  can_throttle_enable: 0
  can_brake_enable: 0
  can_longitudinal_enable: 0   # legacy startup default: enables both throttle and brake when set to 1
  can_steering_enable: 0
  longitudinal_controller: "pid"   # keypad, pid

  draw_inference_overlay: 1
  draw_acc_overlay: 1
  draw_lka_overlay: 1
  draw_behavior_overlay: 1
  draw_collision_overlay: 1
  draw_ground_grid_overlay: 1
  draw_lane_detect_overlay: 1   # Lane detect overlay startup default; runtime toggle uses keypad H
  draw_status_hud: 1

  ground_grid_forward_start_m: 1.0
  ground_grid_forward_end_m: 40.0
  ground_grid_lateral_min_m: -8.0
  ground_grid_lateral_max_m: 8.0
  ground_grid_spacing_m: 1.0
  ground_grid_sample_step_m: 0.25
  ground_grid_major_every_n: 5
  ground_grid_draw_labels: 1

input:
  video_path: "../video/1280x720/Paper.mp4"
  camera_index: -1
  capture_width: 1280
  capture_height: 720
  window_name: "Screen"
  fullscreen: 1

geometry:
  draw_kpt_world: 0
  draw_box_world: 0
  world_unit_scale: 0.01

model:
  classify_model_width: 60
  classify_model_height: 60
  tensorrt:
    topk: 100
    score_thres: 0.3
    iou_thres: 0.6
    num_labels: 7

sort:
  max_age: 5
  min_hits: 3
  iou_threshold: 0.3
  history_length: 10

sort_keypoint:
  filter_type: "kf"
  allow_env_override: 1
  ema:
    conf_thr: 0.2
    alpha_lo: 0.15
    alpha_hi: 0.65
  kf:
    conf_thr: 0.2
    process_var: 1.0
    meas_var_base: 25.0
    gate_dist_px: 80.0
    init_pos_var: 100.0
    init_vel_var: 1000.0

acc:
  lateral_limit_m: 1.0
  min_forward_m: 0.5
  max_forward_m: 60.0
  lead_hysteresis_m: 1.0
  cruise_speed_kmh: 90.0
  time_gap_s: 1.5
  standstill_gap_m: 5.0
  max_accel_mps2: 3.0
  comfort_decel_mps2: 2.5
  max_decel_mps2: 6.0
  jerk_limit_mps3: 4.0
  brake_full_decel_mps2: 2.0
  brake_multiplier: 1.0
  throttle_accel_deadband_mps2: 0.15
  brake_accel_deadband_mps2: 0.20
  coast_gap_margin_m: 3.0
  coast_time_gap_margin_s: 0.8
  brake_gap_margin_m: 0.0
  gap_error_decel_gain_mps2_per_m: 0.35
  min_brake_decel_mps2: 0.35
  ttc_soft_brake_s: 3.0
  ttc_hard_brake_s: 1.5
  high_speed_relax_enable: 1
  high_speed_relax_min_kmh: 40.0
  high_speed_brake_time_gap_s: 0.55
  high_speed_brake_gap_margin_m: 2.0
  high_speed_brake_closing_mps: 1.0
  default_fps: 20.0
  use_external_ego_speed: 1

lka:
  wheel_base_m: 2.62
  velocity_mps: 5.0
  softening: 0.5
  lateral_controller: "mpc"   # stanley 或 mpc；只切換 LKA raw steer，後續 Stability 防護共用同一路徑
  k_straight: 1.0
  k_curve: 3.5
  mpc_horizon: 20
  mpc_q_cte: 5.0
  mpc_q_heading: 1.5
  mpc_q_steer: 1.2
  mpc_r_steer_rate: 4.0
  x_ref_straight_m: 0.3
  x_heading_straight_m: 1.5
  x_ref_curve_m: 0.3
  x_heading_curve_m: 0.8
  enable_feedforward: 1
  ff_gain: 1.0
  x_curvature_m: 1.0
  max_ff_deg: 25.0
  max_steer_deg: 59.0
  max_steer_rate_deg_s: 300.0
  dt_s: 0.04
  speed_profiles_enable: 1
  speed_profiles:
    - {enabled: 1, min_speed_kmh: 0.0,  max_speed_kmh: 10.0, softening: 0.5, k_straight: 1.0, k_curve: 3.5, mpc_horizon: 20, mpc_q_cte: 5.0, mpc_q_heading: 1.5, mpc_q_steer: 1.2, mpc_r_steer_rate: 4.0, x_curvature_m: 1.0}
    - {enabled: 1, min_speed_kmh: 10.0, max_speed_kmh: 20.0, softening: 0.5, k_straight: 1.0, k_curve: 3.5, mpc_horizon: 20, mpc_q_cte: 5.0, mpc_q_heading: 1.5, mpc_q_steer: 1.2, mpc_r_steer_rate: 4.0, x_curvature_m: 1.0}
    - {enabled: 1, min_speed_kmh: 20.0, max_speed_kmh: 30.0, softening: 0.5, k_straight: 1.0, k_curve: 3.5, mpc_horizon: 20, mpc_q_cte: 5.0, mpc_q_heading: 1.5, mpc_q_steer: 1.2, mpc_r_steer_rate: 4.0, x_curvature_m: 1.0}
    - {enabled: 1, min_speed_kmh: 30.0, max_speed_kmh: 40.0, softening: 0.5, k_straight: 1.0, k_curve: 3.5, mpc_horizon: 20, mpc_q_cte: 5.0, mpc_q_heading: 1.5, mpc_q_steer: 1.2, mpc_r_steer_rate: 4.0, x_curvature_m: 1.0}
    - {enabled: 1, min_speed_kmh: 40.0, max_speed_kmh: 50.0, softening: 0.5, k_straight: 1.0, k_curve: 3.5, mpc_horizon: 20, mpc_q_cte: 5.0, mpc_q_heading: 1.5, mpc_q_steer: 1.2, mpc_r_steer_rate: 4.0, x_curvature_m: 1.0}
    - {enabled: 1, min_speed_kmh: 50.0, max_speed_kmh: 60.0, softening: 0.5, k_straight: 1.0, k_curve: 3.5, mpc_horizon: 20, mpc_q_cte: 5.0, mpc_q_heading: 1.5, mpc_q_steer: 1.2, mpc_r_steer_rate: 4.0, x_curvature_m: 1.0}
    - {enabled: 1, min_speed_kmh: 60.0, max_speed_kmh: 70.0, softening: 0.5, k_straight: 1.0, k_curve: 3.5, mpc_horizon: 20, mpc_q_cte: 5.0, mpc_q_heading: 1.5, mpc_q_steer: 1.2, mpc_r_steer_rate: 4.0, x_curvature_m: 1.0}
    - {enabled: 1, min_speed_kmh: 70.0, max_speed_kmh: 80.0, softening: 0.5, k_straight: 1.0, k_curve: 3.5, mpc_horizon: 30, mpc_q_cte: 5.0, mpc_q_heading: 3.0, mpc_q_steer: 0.5, mpc_r_steer_rate: 2.5, x_curvature_m: 3.0}
    - {enabled: 1, min_speed_kmh: 80.0, max_speed_kmh: 90.0, softening: 0.5, k_straight: 1.0, k_curve: 3.5, mpc_horizon: 30, mpc_q_cte: 5.0, mpc_q_heading: 3.0, mpc_q_steer: 0.5, mpc_r_steer_rate: 2.5, x_curvature_m: 3.0}
    - {enabled: 1, min_speed_kmh: 90.0, max_speed_kmh: 100.0, softening: 0.5, k_straight: 1.0, k_curve: 3.5, mpc_horizon: 30, mpc_q_cte: 5.0, mpc_q_heading: 3.0, mpc_q_steer: 0.5, mpc_r_steer_rate: 2.5, x_curvature_m: 3.0}
    # - {enabled: 1, min_speed_kmh: 0.0,  max_speed_kmh: 10.0,  softening: 0.8,  k_straight: 0.8, k_curve: 3.2, mpc_horizon: 18, mpc_q_cte: 4.0,  mpc_q_heading: 1.0, mpc_q_steer: 1.8, mpc_r_steer_rate: 6.0, x_curvature_m: 1.0}
    # - {enabled: 1, min_speed_kmh: 10.0, max_speed_kmh: 20.0,  softening: 0.7,  k_straight: 0.9, k_curve: 3.5, mpc_horizon: 20, mpc_q_cte: 4.5,  mpc_q_heading: 1.2, mpc_q_steer: 1.6, mpc_r_steer_rate: 5.5, x_curvature_m: 1.2}
    # - {enabled: 1, min_speed_kmh: 20.0, max_speed_kmh: 30.0,  softening: 0.6,  k_straight: 1.0, k_curve: 3.8, mpc_horizon: 22, mpc_q_cte: 5.0,  mpc_q_heading: 1.4, mpc_q_steer: 1.4, mpc_r_steer_rate: 5.0, x_curvature_m: 1.5}
    # - {enabled: 1, min_speed_kmh: 30.0, max_speed_kmh: 40.0,  softening: 0.55, k_straight: 1.1, k_curve: 4.2, mpc_horizon: 24, mpc_q_cte: 5.5,  mpc_q_heading: 1.6, mpc_q_steer: 1.2, mpc_r_steer_rate: 4.8, x_curvature_m: 1.8}
    # - {enabled: 1, min_speed_kmh: 40.0, max_speed_kmh: 50.0,  softening: 0.5,  k_straight: 1.25, k_curve: 4.8, mpc_horizon: 26, mpc_q_cte: 6.0, mpc_q_heading: 1.9, mpc_q_steer: 1.0, mpc_r_steer_rate: 4.6, x_curvature_m: 2.2}
    # - {enabled: 1, min_speed_kmh: 50.0, max_speed_kmh: 60.0,  softening: 0.5,  k_straight: 1.45, k_curve: 5.4, mpc_horizon: 28, mpc_q_cte: 6.5, mpc_q_heading: 2.2, mpc_q_steer: 0.9, mpc_r_steer_rate: 4.4, x_curvature_m: 2.8}
    # - {enabled: 1, min_speed_kmh: 60.0, max_speed_kmh: 70.0,  softening: 0.45, k_straight: 1.7, k_curve: 6.0, mpc_horizon: 32, mpc_q_cte: 7.0, mpc_q_heading: 2.6, mpc_q_steer: 0.8, mpc_r_steer_rate: 4.2, x_curvature_m: 3.5}
    # - {enabled: 1, min_speed_kmh: 70.0, max_speed_kmh: 80.0,  softening: 0.45, k_straight: 2.0, k_curve: 6.7, mpc_horizon: 36, mpc_q_cte: 8.0, mpc_q_heading: 3.0, mpc_q_steer: 0.7, mpc_r_steer_rate: 4.0, x_curvature_m: 4.5}
    # - {enabled: 1, min_speed_kmh: 80.0, max_speed_kmh: 90.0,  softening: 0.4,  k_straight: 2.35, k_curve: 7.3, mpc_horizon: 40, mpc_q_cte: 9.0, mpc_q_heading: 3.5, mpc_q_steer: 0.65, mpc_r_steer_rate: 3.8, x_curvature_m: 5.5}
    # - {enabled: 1, min_speed_kmh: 90.0, max_speed_kmh: 100.0, softening: 0.4,  k_straight: 2.75, k_curve: 8.0, mpc_horizon: 45, mpc_q_cte: 10.0, mpc_q_heading: 4.0, mpc_q_steer: 0.6, mpc_r_steer_rate: 3.6, x_curvature_m: 6.5}

  use_confidence: 1
  conf_threshold: 0.5
  min_x_m: 0.05
  max_x_m: 30.0
  max_abs_y_m: 5.0
  curvature_samples: 6
  metric_w_mean: 1.0
  metric_w_std: 0.5
  use_sigmoid_probability: 1
  metric_threshold: 0.08
  metric_sensitivity: 25.0
  use_hysteresis: 0
  metric_enter_curve: 0.10
  metric_exit_curve: 0.06
  enable_prob_lowpass: 1
  prob_alpha: 0.85
  lane_width_m: 3.76
  lane_center_offset_m: 0.0
  visual_limit_m: 20.0
  lane_detect_vehicle_half_width_m: 0.90
  lane_detect_forward_range_m: 3.0
  lane_detect_draw_end_m: 20.0
  lane_detect_bottom_range_m: 3.0
  lane_detect_contact_margin_m: 0.0
  lane_detect_mode: "quadratic_curve"   # direct_world, quadratic_curve

stability:
  mass_kg: 1350.0
  wheelbase_m: 2.62
  steering_ratio: 2.5
  g: 9.81
  mu_static: 0.90
  mu_dynamic: 0.75
  mu_lowpass_alpha: 0.90
  lat_safety: 0.85
  total_safety: 0.90
  lat_accel_comfort_mps2: 60
  long_accel_comfort_mps2: 1.8
  long_decel_comfort_mps2: 2.8
  emergency_decel_cap_mps2: 6.0
  steer_high_speed_guard_kmh: 60.0
  min_speed_for_curvelimit_mps: 1.0
  speed_lowpass_alpha: 0.85
  max_speed_drop_mps2: 3.5
  max_speed_rise_mps2: 2.0
  slip_enter_ratio: 0.98
  slip_exit_ratio: 0.85
  ttc_hard_guard_s: 0.8
  w_lat: 1.0
  w_long: 4.0
  max_jerk_acc_mps3: 2.0
  max_jerk_dec_mps3: 3.5
  use_measured_alat: 1
  alat_lpf_alpha: 0.25
  alat_meas_timeout_s: 0.2
  alat_cmd_guard_ratio: 0.5
  use_uncertainty_scaling: 1
  uncert_gain: 0.2
  uncert_sigma_dist_max: 5.0
  ttc_sigma_k: 1.0

collision:
  roi_y_half_m: 5.63
  roi_x_min_m: 0.0
  roi_x_max_m: 60.0
  danger_forward_m: 10.0
  corridor_half_width_m: 1.2
  path_sample_step_m: 0.25
  horizon_s: 4.0
  step_s: 0.2
  ttc_warn_s: 3.0
  ttc_brake_s: 1.2
  dis_warn_m: 12.0
  dis_brake_m: 6.0
  max_extra_brake_0_10: 4.0
  max_avoid_steer_deg: 4.0
  enable_classify_warning: 1
  prefer_trackingbox_classify: 1
  classify_ttl_frames: 5
  enable_bbox_fallback_classify: 0
  classify_car_roi_x_min_px: 400
  classify_car_roi_x_max_px: 880
  classify_car_roi_y_min_px: 250
  classify_center_x_px: 640
  classify_lr_deadband_px: 80
  enable_warning_kf: 1
  warning_kf_q_per_s: 2.0
  warning_kf_r: 1.0
  warning_kf_on_th: 0.65
  warning_kf_off_th: 0.35
  track_warmup_frames: 3
  attention_half_width_m: 2.5
  min_approach_speed_mps: 0.8
  threat_hold_frames: 6
  threat_switch_hysteresis_s: 0.4
  tracker_alpha: 0.6
  tracker_beta: 0.2
  tracker_dt_min_s: 0.005
  tracker_dt_max_s: 0.2
  tracker_stale_frames: 10
  tracker_residual_reset_m: 4.0
  tracker_vel_max_mps: 50.0
  heading_fusion_alpha: 0.4

behavior:
  enable: 1
  use_custom_layout: 0
  custom_layout: [11, 12, 13, 14, 6, 7, 8, 9, 2, 3, 4, 5]

ablation:
  enable: 1
  output_path: ""
  output_dir: "research_logs"
  flush_every_n: 30
  plot_size_px: 1200
  plot_margin_px: 80
  virtual_road_enable: 1
  virtual_road_mode: "csv"
  virtual_road_csv_path: "./road_csv/arc.csv"
  virtual_road_length_m: 300.0
  virtual_road_step_m: 0.5
  virtual_road_lane_width_m: 3.76
  virtual_road_arc_radius_m: 120.0
  virtual_road_s_amplitude_m: 2.0
  virtual_road_s_wavelength_m: 80.0
  virtual_sim_frame_count: 1200
  virtual_sim_dt_s: 0.05
  virtual_sim_speed_kmh: 80.0
  virtual_sim_max_steer_deg: 35.0
  virtual_sim_vc_k_cte: 6.0
  virtual_sim_vc_k_heading: 0.9
  virtual_sim_raw_k_cte: 1.8
  virtual_sim_raw_k_heading: 0.2
  virtual_sim_raw_steer_bias_deg: 2.5
  virtual_sim_raw_steer_osc_amp_deg: 1.0
  virtual_sim_raw_steer_osc_period_s: 6.0
