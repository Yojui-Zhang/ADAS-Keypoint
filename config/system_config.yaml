%YAML:1.0
---
app:
  run_mode: "real_car"      # real_car video virtual_road
  camera_yaml_path: "../Camera-Config/Sensing-3M.yaml"
  icon_path: "../icon"
  fallback_ego_speed_kmh: 40.0
  enable_collision_actuation: 0
  draw_collision_border: 1
  draw_collision_target_box: 1
  show_timing_ms: 1
  render_backend: "opencv"   # opencv 或 opengl；opengl 需以 _opengl 編譯，否則自動 fallback
  wait_key_ms: 30

  enable_keypad_evdev: 1
  keypad_device_path: "/dev/input/event1"

  can_tx_master_enable: 0
  can_throttle_enable: 0
  can_brake_enable: 0
  can_longitudinal_enable: 0   # legacy startup default: enables both throttle and brake when set to 1
  can_steering_enable: 0
  longitudinal_controller: "pid"   # keypad, pid

  draw_inference_overlay: 1
  draw_acc_overlay: 1
  draw_lka_overlay: 1
  draw_behavior_overlay: 1
  draw_collision_overlay: 1
  draw_ground_grid_overlay: 1
  draw_lane_detect_overlay: 1   # Lane detect overlay startup default; runtime toggle uses keypad H
  draw_status_hud: 1

  ground_grid_forward_start_m: 1.0
  ground_grid_forward_end_m: 40.0
  ground_grid_lateral_min_m: -8.0
  ground_grid_lateral_max_m: 8.0
  ground_grid_spacing_m: 1.0
  ground_grid_sample_step_m: 0.25
  ground_grid_major_every_n: 5
  ground_grid_draw_labels: 1

input:
  video_path: "../video/1280x720/Paper.mp4"
  camera_index: 1
  capture_width: 1280
  capture_height: 720
  window_name: "Screen"
  fullscreen: 1

geometry:
  draw_kpt_world: 0
  draw_box_world: 0
  world_unit_scale: 0.01

model:
  classify_model_width: 60
  classify_model_height: 60
  tensorrt:
    topk: 100
    score_thres: 0.3
    iou_thres: 0.6
    num_labels: 7

sort:
  max_age: 5
  min_hits: 3
  iou_threshold: 0.3
  history_length: 10

sort_keypoint:
  filter_type: "kf"
  allow_env_override: 1
  ema:
    conf_thr: 0.2
    alpha_lo: 0.15
    alpha_hi: 0.65
  kf:
    conf_thr: 0.2
    process_var: 1.0
    meas_var_base: 25.0
    gate_dist_px: 80.0
    init_pos_var: 100.0
    init_vel_var: 1000.0

acc:
  lateral_limit_m: 1.0
  min_forward_m: 0.5
  max_forward_m: 80
  lead_hysteresis_m: 3.0
  cruise_speed_kmh: 90.0
  time_gap_s: 1.6
  standstill_gap_m: 4.0
  max_accel_mps2: 1.4
  comfort_decel_mps2: 1.8
  max_decel_mps2: 6.0
  jerk_limit_mps3: 1.5
  brake_full_decel_mps2: 2.0
  brake_multiplier: 1.0
  throttle_accel_deadband_mps2: 0.10
  brake_accel_deadband_mps2: 0.30
  coast_gap_margin_m: 0.5
  coast_time_gap_margin_s: 0.2
  brake_gap_margin_m: 0.0
  gap_error_decel_gain_mps2_per_m: 0.15
  min_brake_decel_mps2: 0.20
  ttc_soft_brake_s: 2.5
  ttc_hard_brake_s: 1.2
  high_speed_relax_enable: 1
  high_speed_relax_min_kmh: 50.0
  high_speed_brake_time_gap_s: 0.65
  high_speed_brake_gap_margin_m: 1.0
  high_speed_brake_closing_mps: 2.0
  speed_hold_enable: 1
  speed_hold_min_speed_kmh: 50.0
  speed_hold_max_closing_mps: 1.2
  speed_hold_min_ttc_s: 4.0
  speed_hold_min_gap_ratio: 0.70
  cut_in_blend_enable: 1
  cut_in_blend_time_s: 0.8
  cut_in_emergency_ttc_s: 2.0
  cut_in_emergency_closing_mps: 3.0
  cut_in_emergency_gap_ratio: 0.65
  default_fps: 20.0
  use_external_ego_speed: 1
  stop_and_go:
    enabled: 1

    # 低於此速度才進入停止狀態機。
    approach_max_speed_kmh: 12.0

    # 前車速度低於此值視為即將停止。
    stationary_lead_max_speed_kmh: 2.0

    # 停車觸發距離：
    # standstill_gap + margin + ego_speed * time
    stop_trigger_margin_m: 3.0
    stop_trigger_time_s: 0.8

    # 低速停止減速度。
    stop_min_decel_mps2: 0.35
    stop_max_decel_mps2: 1.20

    # 自車低於此速度後進入固定煞車保持。
    hold_enter_speed_kmh: 0.50

    # 第一階段封閉場域標定值。
    hold_brake_0_10: 0.35

    # 停止後至少保持一秒，禁止立即重新起步。
    minimum_hold_time_s: 1.0

    # StoppedHold 中前車消失後，確認多久才允許無前車低速恢復。
    target_lost_resume_delay_s: 0.8

    # 前車移動確認。
    resume_lead_min_speed_kmh: 2.0
    resume_distance_delta_m: 1.0
    resume_confirm_time_s: 0.60
    resume_gap_margin_m: 0.80

    # 起步限制。
    resume_max_accel_mps2: 0.60
    resume_target_min_kmh: 5.0
    resume_target_lead_margin_kmh: 3.0
    resume_target_cap_kmh: 12.0

    # 超過此速度後離開起步狀態。
    resume_exit_speed_kmh: 8.0
    resume_timeout_s: 4.0

    # 起步期間若距離再次過近，立即回到停止。
    close_gap_abort_margin_m: 0.30

    # 起步期間短暫漏檢容許時間。
    resume_target_lost_timeout_s: 0.30

lka:
  wheel_base_m: 2.62
  velocity_mps: 5.0
  softening: 0.5
  lateral_controller: "mpc"   # stanley 或 mpc；只切換 LKA raw steer，後續 Stability 防護共用同一路徑
  k_straight: 1.0
  k_curve: 3.5
  mpc_horizon: 20
  mpc_q_cte: 5.0
  mpc_q_heading: 1.5
  mpc_q_steer: 1.2
  mpc_r_steer_rate: 4.0
  # Runtime default: x_* = current_speed_mps * frame_dt_s * dynamic_preview_distance_weight.
  # Only x_* explicitly written inside a speed_profiles item overrides that auto distance.
  dynamic_preview_distance_weight: 5.0
  x_ref_straight_m: 0.3
  x_heading_straight_m: 1.5
  x_ref_curve_m: 0.3
  x_heading_curve_m: 0.8

  enable_feedforward: 1
  ff_gain: 1.0
  x_curvature_m: 1.0
  max_ff_deg: 25.0
  max_steer_deg: 59.0
  max_steer_rate_deg_s: 300.0
